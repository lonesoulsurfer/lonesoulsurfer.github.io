<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lonesoulsurfer — making things since 2011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0c0c0c;
    --surface:  #161616;
    --card:     #1c1c1c;
    --border:   #2a2a2a;
    --amber:    #e8a020;
    --amber-dim:#7a5010;
    --text:     #d4cfc8;
    --muted:    #666;
    --white:    #f0ece6;
    --mono:     'Space Mono', monospace;
    --sans:     'Inter', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .header-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 280px;
  }

  .header-left {
    padding: 48px 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--border);
    position: relative;
    z-index: 2;
  }

  .site-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .site-title {
    font-family: var(--mono);
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 700;
    color: var(--white);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .site-title span { color: var(--amber); }

  .site-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 12px;
    letter-spacing: 0.05em;
  }

  .header-stats {
    display: flex;
    gap: 32px;
    margin-top: 32px;
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }

  .stat-val {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
  }

  .stat-val.counter { color: var(--amber); }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .header-right {
    position: relative;
    overflow: hidden;
  }

  .mosaic {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    height: 100%;
    gap: 2px;
  }

  .mosaic-cell {
    overflow: hidden;
    position: relative;
    background: var(--surface);
  }

  .mosaic-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.55;
    filter: saturate(0.6);
    transition: opacity 0.3s, filter 0.3s;
    display: block;
  }

  .mosaic-cell:hover img {
    opacity: 0.85;
    filter: saturate(1);
  }

  /* placeholder shown while img loads / errors */
  .mosaic-cell .ph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--amber-dim);
    background: var(--surface);
  }

  .header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, var(--bg) 0%, transparent 30%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── NAV BAR ── */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .filter-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 14px 18px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { color: var(--text); }
  .filter-btn.active { color: var(--amber); border-bottom-color: var(--amber); }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .project-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .search-wrap { position: relative; }

  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 12px 6px 28px;
    width: 180px;
    outline: none;
    letter-spacing: 0.05em;
    transition: border-color 0.15s;
  }

  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--amber-dim); }

  .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 10px;
    pointer-events: none;
  }

  /* ── GRID ── */
  .grid-wrap { padding: 32px 48px 64px; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 2px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .card:hover { border-color: var(--amber-dim); z-index: 2; }

  .card-thumb {
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    position: relative;
    background: var(--surface);
  }

  /* fallback fill shown while/if image fails */
  .card-thumb-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    padding: 12px;
    z-index: 0;
  }

  .card-thumb-fallback .icon {
    font-size: 28px;
    opacity: 0.3;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.75);
    transition: filter 0.25s, transform 0.35s;
    position: relative;
    z-index: 1;
  }

  .card:hover .card-thumb img {
    filter: saturate(1);
    transform: scale(1.04);
  }

  .card-cat {
    position: absolute;
    top: 8px;
    left: 8px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 2px 6px;
    background: rgba(0,0,0,0.78);
    color: var(--amber);
    backdrop-filter: blur(4px);
    z-index: 2;
  }

  .card-body {
    padding: 12px 14px 14px;
    border-top: 1px solid var(--border);
  }

  .card-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 36px;
    transition: color 0.15s;
  }

  .card:hover .card-title { color: var(--white); }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }

  .card-views {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .card-views span { color: var(--amber); font-weight: 700; }

  .card-arrow {
    font-size: 10px;
    color: var(--border);
    transition: color 0.15s, transform 0.15s;
  }

  .card:hover .card-arrow { color: var(--amber); transform: translateX(3px); }

  /* ── EMPTY STATE ── */
  .empty {
    display: none;
    padding: 80px 0;
    text-align: center;
  }

  .empty-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-left {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .footer-link {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--amber);
    text-decoration: none;
    text-transform: uppercase;
    border-bottom: 1px solid var(--amber-dim);
    padding-bottom: 1px;
    transition: color 0.15s;
  }

  .footer-link:hover { color: var(--white); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .header-grid { grid-template-columns: 1fr; }
    .header-right { display: none; }
    .header-left { padding: 32px 24px; border-right: none; }
    .nav-bar { padding: 0 16px; overflow-x: auto; }
    .grid-wrap { padding: 24px 16px 48px; }
    footer { padding: 20px 16px; flex-direction: column; gap: 12px; }
    .search-input { width: 130px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

// ── IMAGE PROXY via wsrv.nl (CORS-safe, no API key needed) ──
function proxyImg(url, w) {
  if (!url) return '';
  return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${w}&output=webp&q=80`;
}

// ── VIEW COUNTER ──
function animateCounter(el, target, duration) {
  const start = performance.now();
  (function tick(now) {
    const p = Math.min((now - start) / duration, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(e * target).toLocaleString();
    if (p < 1) requestAnimationFrame(tick);
  })(performance.now());
}

// ── FORMAT VIEWS ──
function fv(v) {
  if (v >= 1000000) return (v/1000000).toFixed(1) + 'M';
  if (v >= 1000)    return Math.round(v/1000) + 'K';
  return v > 0 ? v.toString() : '--';
}

// ── RENDER MOSAIC ──
function buildMosaic(projects) {
  const mosaic = document.getElementById('mosaic');
  projects.filter(p => p.img).slice(0, 15).forEach(p => {
    const cell = document.createElement('div');
    cell.className = 'mosaic-cell';
    cell.innerHTML = `<div class="ph">&#9678;</div><img src="${proxyImg(p.img, 160)}" alt="" loading="lazy">`;
    const img = cell.querySelector('img');
    img.onload = () => cell.querySelector('.ph').style.display = 'none';
    mosaic.appendChild(cell);
  });
}

// ── RENDER GRID ──
let currentCat = 'all', currentSearch = '';

function renderGrid(projects) {
  const q = currentSearch.toLowerCase().trim();
  const filtered = projects.filter(p =>
    (currentCat === 'all' || p.category === currentCat) &&
    (!q || p.title.toLowerCase().includes(q) || p.category.includes(q))
  );

  document.getElementById('countLabel').textContent =
    filtered.length + ' project' + (filtered.length !== 1 ? 's' : '');

  const empty = document.getElementById('empty');
  const grid  = document.getElementById('grid');

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(p => `
    <a class="card" href="${p.url}" target="_blank" rel="noopener">
      <div class="card-thumb">
        <div class="card-thumb-fallback">
          <span class="icon">${CAT_ICONS[p.category] || '🔩'}</span>
          <span>${p.category || ''}</span>
        </div>
        ${p.img ? `<img
          src="${proxyImg(p.img, 400)}"
          alt="${p.title}"
          loading="lazy"
          onerror="this.style.display='none'"
        >` : ''}
        <div class="card-cat">${p.category || 'making'}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-meta">
          <div class="card-views"><span>${fv(p.views || 0)}</span> views</div>
          <span class="card-arrow">&#8594;</span>
        </div>
      </div>
    </a>
  `).join('');
}

// ── WIRE UP FILTERS AND SEARCH ──
function initControls(projects) {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderGrid(projects);
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    currentSearch = e.target.value;
    renderGrid(projects);
  });
}

// ── MAIN: LOAD projects.json ──
fetch('projects.json')
  .then(r => r.json())
  .then(projects => {
    PROJECTS = projects;

    // Update project count in header
    document.querySelector('.stat-val:not(.counter)').textContent = projects.length;

    // Calculate and animate total views
    const totalViews = projects.reduce((sum, p) => sum + (p.views || 0), 0);
    animateCounter(document.getElementById('viewCounter'), totalViews, 2200);

    buildMosaic(projects);
    initControls(projects);
    renderGrid(projects);
  })
  .catch(err => {
    // Fallback if projects.json fails to load
    console.error('Could not load projects.json:', err);
    document.getElementById('countLabel').textContent = 'could not load projects';
  });
</script>
